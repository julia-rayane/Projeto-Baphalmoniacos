<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Baphalmoníacos - Autenticação</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fdf3f3; color: #333; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: 20px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #b32424; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin: 6px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #248a3d; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #1c6b2f; }
        .voltar { display: block; text-align: center; margin-bottom: 20px; color: #b32424; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <a href="index.html" class="voltar">← Voltar para o Site Principal</a>

    <!-- 1. FORMULÁRIO DE CADASTRO -->
    <div class="box">
        <h2>1. Criar Conta (Signup)</h2>
        <form id="formSignup">
            <label>Nome:</label>
            <input type="text" id="nomeSignup" placeholder="Seu nome completo" required>
            
            <label>E-mail:</label>
            <input type="email" id="emailSignup" placeholder="seuemail@email.com" required>
            
            <label>Senha:</label>
            <input type="password" id="senhaSignup" placeholder="Sua senha" required>
            
            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <!-- 2. FORMULÁRIO DE LOGIN -->
    <div class="box">
        <h2>2. Acessar Conta (Signin)</h2>
        <form id="formSignin">
            <label>E-mail:</label>
            <input type="email" id="emailSignin" placeholder="seuemail@email.com" required>
            
            <label>Senha:</label>
            <input type="password" id="senhaSignin" placeholder="Sua senha" required>
            
            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        // --- 1. LÓGICA DE CADASTRO (SIGNUP) ---
        document.getElementById('formSignup').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nomeSignup').value;
            const email = document.getElementById('emailSignup').value;
            const senha = document.getElementById('senhaSignup').value;

            try {
                const res = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });

                const dados = await res.json();

                if (res.ok) {
                    alert('Usuário cadastrado com sucesso! Agora faça o login abaixo.');
                    document.getElementById('formSignup').reset();
                } else {
                    alert(dados.error || 'Erro ao realizar cadastro.');
                }
            } catch (err) {
                console.error('Erro no cadastro:', err);
            }
        });

        // --- 2. LÓGICA DE LOGIN (SIGNIN) + SALVAR TOKEN ---
        document.getElementById('formSignin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailSignin').value;
            const senha = document.getElementById('senhaSignin').value;

            try {
                const res = await fetch('/signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const dados = await res.json();

                if (res.ok && dados.token) {
                    // 🔑 GUARDA O TOKEN NO NAVEGADOR
                    localStorage.setItem('token', dados.token);
                    alert('Login realizado com sucesso! Redirecionando para o Painel Administrativo...');
                    window.location.href = '/admin.html';
                } else {
                    alert(dados.error || 'E-mail ou senha incorretos.');
                }
            } catch (err) {
                console.error('Erro no login:', err);
            }
        });
    </script>
</body>
</html>
